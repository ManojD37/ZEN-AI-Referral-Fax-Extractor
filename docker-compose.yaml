services:
  app:
    build: .
    ports:
      - "8080:8000"  # Unified port for React (Frontend) and FastAPI (API)
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=local
      - DEBUG=true
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    restart: unless-stopped
